name: Verify and package Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python -m pip install playwright==1.61.0
      - run: python -m playwright install chromium
      - run: python -X utf8 tests/browser.py
      - run: python -X utf8 tests/browser_auto.py
      - run: python -X utf8 tests/browser_personal.py
      - run: python -X utf8 tests/browser_cli.py
      - run: npm run package:windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: character-studio-windows-x64
          compression-level: 0
          path: |
            .local/distribution/character-studio-windows-x64.zip
            .local/distribution/character-studio-windows-x64.zip.sha256

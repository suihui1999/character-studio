name: Feature request / 功能建议
description: Suggest a simpler or more useful workflow / 提出更方便的使用方式
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / 你想完成什么？
      description: Describe the task and where the current workflow gets in your way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience / 希望怎样操作？
